<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient - Stadium Electric Blue to Deep Oceanic Blue -->
    <linearGradient id="stadiumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0089D8" />
      <stop offset="45%" stop-color="#2D37FB" />
      <stop offset="100%" stop-color="#14197E" />
    </linearGradient>

    <!-- Metallic/Gloss Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Vibrant Yellow Accent for the Padel Ball -->
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F952" />
      <stop offset="100%" stop-color="#B2DF00" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05082E" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#stadiumBg)" />
  
  <!-- Subtle Top Specular Gloss -->
  <rect x="24" y="24" width="464" height="232" rx="112" ry="112" fill="url(#sheenGrad)" />

  <!-- Inner Border Stroke -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" />

  <!-- Dynamic Stadium S Emblem with Padel Dynamics -->
  <g filter="url(#shadowFilter)">
    <!-- Stylized Modern Athletic 'S' Icon -->
    <path 
      d="M344,142 C320,126 288,118 250,118 C176,118 132,154 132,208 C132,258 170,282 232,298 L266,306 C308,317 328,332 328,358 C328,390 294,410 248,410 C202,410 160,390 134,360 L102,398 C138,442 192,464 252,464 C338,464 388,422 388,354 C388,300 350,274 286,258 L252,250 C214,240 192,226 192,202 C192,176 220,160 258,160 C292,160 322,174 344,194 Z" 
      fill="#ffffff" 
    />
    
    <!-- Neon Padel Ball Accent -->
    <circle cx="364" cy="148" r="28" fill="url(#ballGrad)" stroke="#ffffff" stroke-width="4" />
    <path d="M348,136 Q364,148 348,160" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M380,136 Q364,148 380,160" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
